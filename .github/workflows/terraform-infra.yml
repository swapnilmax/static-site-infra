name: "Terraform Infra Deployment"

on:
  workflow_dispatch:
    inputs:
      bucket_name:
        description: "S3 Bucket name for the website"
        required: true
        type: string
      cloudfront_name:
        description: "CloudFront Distribution Name"
        required: true
        type: string
      iam_user_name:
        description: "IAM User name for deployment"
        required: true
        type: string
      dynamodb_table_name:
        description: "DynamoDB table name for Terraform lock"
        required: true
        type: string

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Terraform Init
        working-directory: ./infra
        run: terraform init

      - name: Terraform Plan
        working-directory: ./infra
        run: |
          terraform plan \
            -var="bucket_name=${{ github.event.inputs.bucket_name }}" \
            -var="cloudfront_name=${{ github.event.inputs.cloudfront_name }}" \
            -var="iam_user_name=${{ github.event.inputs.iam_user_name }}" \
            -var="dynamodb_table_name=${{ github.event.inputs.dynamodb_table_name }}"

      - name: Terraform Apply
        run: |
          terraform apply -auto-approve \
            -var="bucket_name=${{ github.event.inputs.bucket_name }}" \
            -var="cloudfront_name=${{ github.event.inputs.cloudfront_name }}" \
            -var="iam_user_name=${{ github.event.inputs.iam_user_name }}" \
            -var="dynamodb_table_name=${{ github.event.inputs.dynamodb_table_name }}"