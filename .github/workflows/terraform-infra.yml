name: "Terraform Infra Deployment"

on:
  workflow_dispatch:
    inputs:
      bucket_name:
        description: "S3 Bucket name for the website"
        required: true
        type: string
      iam_user_name:
        description: "IAM User name for deployment"
        required: true
        type: string

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Terraform Init
        working-directory: ./infra
        run: |
          terraform init -input=false \
            -backend-config="bucket=static-site-state-bucket-007" \
            -backend-config="key=state/${{ github.event.inputs.bucket_name }}.tfstate" \
            -backend-config="region=ap-south-1" \
            -backend-config="encrypt=true" \
            -backend-config="dynamodb_table=terraform-locks"

      - name: Terraform Validate
        working-directory: ./infra
        run: terraform validate

      - name: Terraform Plan
        working-directory: ./infra
        run: |
          terraform plan -input=false \
            -var="bucket_name=${{ github.event.inputs.bucket_name }}" \
            -var="iam_user_name=${{ github.event.inputs.iam_user_name }}"

      - name: Terraform Apply
        working-directory: ./infra
        run: |
          terraform apply -auto-approve \
            -var="bucket_name=${{ github.event.inputs.bucket_name }}" \
            -var="iam_user_name=${{ github.event.inputs.iam_user_name }}"
